name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test
        env:
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
          NEXTAUTH_SECRET: 'test-secret-for-ci'
          NEXTAUTH_URL: 'http://localhost:3000'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
          NEXTAUTH_SECRET: 'test-secret-for-ci'
          NEXTAUTH_URL: 'http://localhost:3000'

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  no-placeholders:
    name: No Placeholder Credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for placeholder API keys
        run: |
          echo "Scanning for placeholder credentials..."
          FOUND=0
          for pattern in "sk-placeholder" "re_placeholder" "sk_test_placeholder"; do
            MATCHES=$(grep -rn "$pattern" --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' . || true)
            if [ -n "$MATCHES" ]; then
              echo "❌ Found '$pattern':"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "❌ Placeholder credentials detected! Replace with env validation."
            exit 1
          fi
          echo "✅ No placeholder credentials found."

  audit:
    name: Launch Audit
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck, no-placeholders, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - name: Run repo audit
        run: node scripts/repo-audit.mjs
      - name: Check for critical findings
        run: |
          CRITICAL=$(grep -c '| CRITICAL |' LAUNCH_READINESS.md || true)
          if [ "$CRITICAL" -gt 0 ]; then
            echo "⚠️ $CRITICAL critical findings remain (informational, not blocking)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: launch-readiness-report
          path: LAUNCH_READINESS.md

  enterprise-audit:
    name: Enterprise Audit
    runs-on: ubuntu-latest
    needs: [lint, test, typecheck, no-placeholders, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - name: Run enterprise audit
        run: node scripts/enterprise-audit.mjs
        env:
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
          NEXTAUTH_SECRET: 'test-secret-for-ci'
          NEXTAUTH_URL: 'http://localhost:3000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enterprise-audit-report
          path: AUDIT_REPORT.md

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: npm audit (critical/high)
        run: npm audit --audit-level=critical || true
      - name: Check for secrets in source
        run: |
          echo "Scanning for leaked secrets..."
          FOUND=0
          for pattern in "sk-[a-zA-Z0-9]{20,}" "ghp_[a-zA-Z0-9]{36}" "AKIA[0-9A-Z]{16}"; do
            MATCHES=$(grep -rn -E "$pattern" --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.json' . 2>/dev/null | grep -v 'node_modules' | grep -v '.env.example' || true)
            if [ -n "$MATCHES" ]; then
              echo "❌ Potential secret found matching $pattern:"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "❌ Potential secrets detected in source code!"
            exit 1
          fi
          echo "✅ No secrets detected in source code."
